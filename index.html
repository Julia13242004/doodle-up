<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Прыгай по платформам, собирай вкусняшки и найди десять подарков.">
  <title>Andrey, jump!</title>
  <link rel="icon" type="image/png" data-sprite="prize-gift">
  <link rel="stylesheet" href="./styles.css?v=3">
  <script type="module" src="./main.js?v=4.1"></script>
</head>
<body>
  <main class="game" id="game" data-mode="menu">
    <canvas id="field" aria-label="Игровое поле"></canvas>

    <header class="hud" id="hud" hidden>
      <button class="round pause" id="pause" type="button" aria-label="Пауза"><span></span><span></span></button>
      <div class="scoreboard" aria-label="Высота">
        <span class="best">Рекорд <span id="best">0</span></span>
        <strong id="score">0</strong>
      </div>
      <div class="counters">
        <div class="pill gifts" aria-label="Подарки">
          <img data-sprite="prize-gift" alt=""><span id="gifts">0</span><span class="goal">/ 10</span>
        </div>
        <div class="pill life" aria-label="Жизни"><span aria-hidden="true">♥</span><span id="life">3</span></div>
      </div>
    </header>

    <div class="game-status">
      <span class="effect effect-burger" id="effect-burger" hidden>Ускорение · <span class="effect-seconds"></span> с</span>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
    <div class="effect effect-cherry" id="effect-cherry" role="group" aria-label="Движение платформ" hidden>
      <img data-sprite="prize-cherry" alt="">
      <b><span class="effect-seconds"></span> с</b>
    </div>

    <div class="controls" id="controls" hidden>
      <button class="round direction" id="left" type="button" aria-label="Двигаться влево">←</button>
      <button class="round fire" id="fire" type="button" aria-label="Стрелять">↑</button>
      <button class="round direction" id="right" type="button" aria-label="Двигаться вправо">→</button>
    </div>

    <section class="overlay" id="menu" aria-labelledby="game-title">
      <div class="menu-panel">
        <div class="menu-art" aria-hidden="true">
          <div class="art-ring"></div>
          <div class="art-tick art-tick-one"></div><div class="art-tick art-tick-two"></div>
          <img class="art-hero" data-sprite="Doodle" alt="">
          <img class="art-platform" data-sprite="birthday/platform-birthday-normal-game" alt="">
          <img class="art-gift" data-sprite="prize-gift" alt="">
          <span class="art-star">✦</span>
        </div>
        <h1 id="game-title" lang="en">Andrey,<br><span>jump!</span></h1>
        <p class="lead">Собери <b>10 подарков</b> и открой сюрприз.</p>
        <button class="action" id="start" type="button" disabled>Загрузка…</button>
        <p class="hint">← → или касания по краям<br>↑ или пробел — выстрел</p>
      </div>
    </section>
